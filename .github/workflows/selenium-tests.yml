name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Selenium tests
        run: mvn clean test